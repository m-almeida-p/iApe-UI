{{/* What can be done with a finished reply: copy its text, as it is (Markdown), which the button holds. */}}
{{define "partial:message_actions"}}<div class="message-actions" data-testid="message-actions">
  <button type="button" class="btn btn-sm btn-outline-secondary" data-testid="copy-message" aria-label="Copy response"
          data-raw="{{.Raw}}">Copy</button>
</div>{{end}}
