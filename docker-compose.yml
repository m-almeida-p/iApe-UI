# Local infrastructure for agent-web-ui.
#
#   docker compose up -d --wait     PostgreSQL and the scripted BFF
#
# The web server runs from source (scripts/run.sh or make run), not in Docker: it asks the BFF as a Yape
# account, with a token that the program YAPE_TOKEN_BIN prints (yape-token), and that program belongs to
# the computer the web server runs on, not to a container. Point it at the scripted BFF with
# AGENT_BASE_URL=http://localhost:9093 and YAPE_TOKEN_BIN=scripts/test-token.sh (the defaults of .env.example),
# or at the real BFF (http://localhost:4000) with yape-token.
#
# Settings come from .env; create it with scripts/init-env.sh. Everything listens on 127.0.0.1 only.
name: iape-ui

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentwebui}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?there is no .env yet, run scripts/init-env.sh}"
      POSTGRES_DB: ${POSTGRES_DB:-agentwebui}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The scripted stand-in for the agent service's BFF (cmd/test-bff): it answers from a script, so the page can be tried with no
  # Yape account. A message with #slow, #error, #tool, #markdown or #html says what the reply is; #pay, #otp and #contact ask
  # for a card.
  agent:
    build:
      context: .
      dockerfile: Dockerfile.testbff
    image: agent-web-ui-testbff
    restart: unless-stopped
    environment:
      # How fast the scripted replies stream; raise the chunks for a long #slow reply.
      TEST_BFF_WORD_DELAY: ${TEST_BFF_WORD_DELAY:-10ms}
      TEST_BFF_SLOW_DELAY: ${TEST_BFF_SLOW_DELAY:-100ms}
      TEST_BFF_SLOW_CHUNKS: ${TEST_BFF_SLOW_CHUNKS:-50}
    ports:
      - "127.0.0.1:${AGENT_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "/test-bff", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
